name: Codogotchi
options:
  bundleIdPrefix: com.codogotchi
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: "928CA6F2BP"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Codogotchi:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - ".soa/**"
      - path: Fixtures/state-json
        type: folder
        buildPhase: resources
      - path: Fixtures/maew
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Codogotchi
        CFBundleDisplayName: Codogotchi
        CFBundleIdentifier: com.codogotchi.app
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "3.0.3"
        CFBundleVersion: "16"
        SUFeedURL: https://codogotchi.app/appcast.xml
        SUPublicEDKey: YCLg2RvYb8ddEhgeWW24yX07oN3xXYUzYW5yrhEZtqI=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    dependencies:
      - framework: Frameworks/Sparkle.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Codogotchi
        PRODUCT_BUNDLE_IDENTIFIER: com.codogotchi.app
        GENERATE_INFOPLIST_FILE: NO
        # The embed-binaries phase shells out to bun and reads the workspace;
        # user script sandboxing would block those reads. Scoped to this target
        # only so the test target keeps the default sandboxing.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: Codogotchi.entitlements
    postBuildScripts:
      # Compile the standalone arm64 CLI binaries and embed them directly into
      # Codogotchi.app/Contents/Resources/. Runs every build (idempotent) so the
      # app is self-contained with no PATH or workspace-runtime prerequisite.
      - name: Embed codogotchi binaries
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/../../scripts/build-binaries.sh" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
  CodogotchiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MenubarTests
    dependencies:
      - target: Codogotchi
      - framework: Frameworks/Sparkle.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codogotchi.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Codogotchi:
    build:
      targets:
        Codogotchi: all
        CodogotchiTests: [test]
    test:
      targets:
        - CodogotchiTests
    run:
      config: Debug
