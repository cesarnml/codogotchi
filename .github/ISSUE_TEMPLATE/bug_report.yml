name: 🐛 Bug Report
description: Something broke — crashes, install failures, pet window problems, agent integration issues.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Codogotchi version
      description: Output of `codogotchi --version`
      placeholder: v1.0.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version + chip
      placeholder: macOS 15.5, Apple Silicon (M3)
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent CLI
      options:
        - Claude Code
        - Codex
        - Cursor
        - Other (describe below)
        - None / not agent-related
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected vs. what happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Drag and drop screenshots, or paste relevant log output.
